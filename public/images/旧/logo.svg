<svg xmlns="http://w3.org" viewBox="0 0 320 60" width="220" height="40">
  <defs>
    <style>
      .logo-bg { fill: #ffffff; }
      .logo-text-black { fill: #000000; font-family: 'Inter', sans-serif; font-weight: 900; font-size: 26px; }
      .logo-text-white { fill: #ffffff; font-family: 'Inter', sans-serif; font-weight: 900; font-size: 32px; letter-spacing: 1px; }
    </style>
  </defs>
  <!-- 左側の [CT] 四角マーク -->
  <rect x="0" y="5" width="48" height="48" rx="8" class="logo-bg" />
  <text x="6" y="39" class="logo-text-black">CT</text>
  <!-- 右側の [COACHTECH] 文字 -->
  <text x="64" y="41" class="logo-text-white">COACHTECH</text>
</svg>